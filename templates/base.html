<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1410">
    <title>{{ t.app_title }}</title>

    <!-- Google Fonts: Plus Jakarta Sans (Latin) + Hind (Devanagari) + Hind Vadodara (Gujarati) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind:wght@400;500;600;700&family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% block topbar %}
    <header class="top-bar">
        <a href="{{ url_for('home') }}" class="navbar-brand">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="" class="brand-logo">
        </a>

        <a href="{{ url_for('home') }}" class="brand-text">{{ t.app_title }}</a>

        <div class="lang-switcher">
            {% for l in languages %}
                <a href="{{ url_for('set_language', code=l.code) }}"
                   class="lang-btn {% if lang == l.code %}active{% endif %}">
                    {{ l.label }}
                </a>
            {% endfor %}
        </div>
    </header>
    {% endblock %}

    {% block content %}{% endblock %}
</body>
</html>
