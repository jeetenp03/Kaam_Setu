<!DOCTYPE html>
<html lang="{{ lang }}" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1410">

    <!-- Block automatic browser/Google Translate prompts —
         the app has its own language switcher (gu / hi / en) -->
    <meta name="google" content="notranslate">

    <title>{{ t.app_title }}</title>

    <!-- Google Fonts: Plus Jakarta Sans (Latin) + Hind (Devanagari) + Hind Vadodara (Gujarati) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind:wght@400;500;600;700&family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="notranslate">
    {% block topbar %}
    <header class="top-bar">
        <a href="{{ url_for('home') }}" class="brand-group">
            <span class="brand-text">{{ t.app_title }}</span>
            <span class="brand-sep">·</span>
            <span class="brand-candidate">{{ t.candidate_name }}</span>
            <span class="brand-candidate-sub">{{ t.vote_date }}</span>
        </a>

        <div class="lang-switcher">
            {% for l in languages %}
                <a href="{{ url_for('set_language', code=l.code) }}"
                   class="lang-btn {% if lang == l.code %}active{% endif %}">
                    {{ l.label }}
                </a>
            {% endfor %}
        </div>
    </header>
    {% endblock %}

    {% block content %}{% endblock %}
</body>
</html>
